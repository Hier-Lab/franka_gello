# This configuration works with the pre-assembled "Franka GELLO Duo" by Franka Robotics GmbH
# See https://franka.de/documents

# LEFT:
#   namespace: "left"
#   com_port: "usb-FTDI_USB__-__Serial_Converter_FTBEO3TK-if00-port0" # REPLACE WITH YOUR ID
#   num_arm_joints: 7
#   joint_signs: [1, -1, 1, -1, 1, 1, 1]
#   gripper: true
#   assembly_offsets: [0.000, 0.000, 3.142, 3.142, 3.142, 4.712, 0.000] # rad
#   gripper_range_rad: [2.00, 3.22]
#   # Optional Dynamixel control parameters for all arm joints (+ gripper):
#   # Warning: If using the OpenRB-150 instead of the U2D2 communication converter,
#   #          do not enable torque until an external 5V power supply is connected to the board's
#   #          power terminal and the jumper is set to "VIN(DXL)". Using USB power for torque
#   #          operation may damage your computer's USB port.
#   dynamixel_torque_enable: [     0,     0,     0,     0,     0,     0,     0,     0] # 1 on, 0 off
#   dynamixel_goal_position: [   0.0,   0.0,   0.0,-1.571,   0.0, 1.571,   0.0, 3.509] # rad
#   dynamixel_kp_p:          [    30,    60,     0,    30,     0,     0,     0,    50]
#   dynamixel_kp_i:          [     0,     0,     0,     0,     0,     0,     0,     0]
#   dynamixel_kp_d:          [   250,   100,    80,    60,    30,    10,     5,     0]

# RIGHT:
#   namespace: "right"
#   com_port: "usb-FTDI_USB__-__Serial_Converter_FTBEQPNR-if00-port0" # REPLACE WITH YOUR ID
#   num_arm_joints: 7
#   joint_signs: [1, -1, 1, -1, 1, 1, 1]
#   gripper: true
#   assembly_offsets: [0.000, 0.000, 3.142, 3.142, 3.142, 4.712, 0.000] # rad
#   gripper_range_rad: [2.00, 3.22]
#   # Optional Dynamixel control parameters for all arm joints (+ gripper):
#   # Warning: If using the OpenRB-150 instead of the U2D2 communication converter,
#   #          do not enable torque until an external 5V power supply is connected to the board's
#   #          power terminal and the jumper is set to "VIN(DXL)". Using USB power for torque
#   #          operation may damage your computer's USB port.
#   dynamixel_torque_enable: [     0,     0,     0,     0,     0,     0,     0,     0] # 1 on, 0 off
#   dynamixel_goal_position: [   0.0,   0.0,   0.0,-1.571,   0.0, 1.571,   0.0, 3.509] # rad
#   dynamixel_kp_p:          [    30,    60,     0,    30,     0,     0,     0,    50]
#   dynamixel_kp_i:          [     0,     0,     0,     0,     0,     0,     0,     0]
#   dynamixel_kp_d:          [   250,   100,    80,    60,    30,    10,     5,     0]

LEFT:
  namespace: "left"
  com_port: "usb-FTDI_USB__-__Serial_Converter_FTBEO3TK-if00-port0" # REPLACE WITH YOUR ID
  num_arm_joints: 7
  joint_signs: [1, -1, 1, -1, 1, 1, 1]
  gripper: true
  # assembly_offsets: [3.142, 3.142, 3.142, 1.571, 0.0, 3.142, 2.357] # rad
  assembly_offsets: [0.0, 0.0, 0.0, 3.142, 0.0, 3.142, 2.357]
  gripper_range_rad: [2.5, 3.2]
  # Optional Dynamixel control parameters for all arm joints (+ gripper):
  # Warning: If using the OpenRB-150 instead of the U2D2 communication converter,
  #          do not enable torque until an external 5V power supply is connected to the board's
  #          power terminal and the jumper is set to "VIN(DXL)". Using USB power for torque
  #          operation may damage your computer's USB port.
  dynamixel_torque_enable: [     1,     1,     1,     1,     1,     1,     1,     1] # 1 on, 0 off
  dynamixel_goal_position: [   0.0,   0.0,   0.0, -1.57,   0.0, 1.571,   0.0,   2.5] # rad
  dynamixel_kp_p:          [    50,     5,    0,     5,     0,     0,     0,    50]
  dynamixel_kp_i:          [     0,     0,     0,     0,     0,     0,     0,     0]
  dynamixel_kp_d:          [   10,    20,    20,    30,    30,    10,     5,     0]

RIGHT:
  namespace: "right"
  com_port: "usb-FTDI_USB__-__Serial_Converter_FTBEQPNR-if00-port0" # REPLACE WITH YOUR ID
  num_arm_joints: 7
  joint_signs: [1, 1, 1, 1, 1, 1, 1]
  gripper: true
  assembly_offsets: [0.0, 3.142, 3.142, 0.0, 0.0, 3.142, 2.357]
  gripper_range_rad: [1.5, 2.041]
  # Optional Dynamixel control parameters for all arm joints (+ gripper):
  # Warning: If using the OpenRB-150 instead of the U2D2 communication converter,
  #          do not enable torque until an external 5V power supply is connected to the board's
  #          power terminal and the jumper is set to "VIN(DXL)". Using USB power for torque
  #          operation may damage your computer's USB port.
  dynamixel_torque_enable: [     1,     1,     1,     1,     1,     1,     1,     1] # 1 on, 0 off
  dynamixel_goal_position: [   0.0,   -0.5,   0.0, -1.57,   0.0, 1.571,   0.0,   2.5] # rad
  dynamixel_kp_p:          [    0,    0,     0,    0,     0,     0,     0,    50]
  dynamixel_kp_i:          [     0,     0,     0,     0,     0,     0,     0,     0]
  dynamixel_kp_d:          [    20,   0,    0,    20,    0,    0,     0,     0]